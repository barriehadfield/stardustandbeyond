<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Corrections console · Stardust &amp; Beyond</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Local admin tool - not linked from the site, not indexed. */
    .adm-wrap { max-width: 1200px; margin: 0 auto; padding: 0 clamp(1rem, 3vw, 2rem) 5rem; }
    .adm-head { position: sticky; top: 0; z-index: 20; background: var(--paper); padding: 1rem 0 0.6rem; border-bottom: 1px solid var(--hair); }
    .adm-head h1 { font-size: 1.4rem; }
    .adm-head .sub { color: var(--muted); font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.3rem; }
    .tabs { display: flex; gap: 0.4rem; margin-top: 0.8rem; flex-wrap: wrap; }
    .tabs button { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.06em; padding: 0.45rem 0.9rem; border-radius: 8px; border: 1px solid var(--hair); background: transparent; color: var(--ink-2); cursor: pointer; }
    .tabs button.on { background: var(--accent); color: #241300; border-color: var(--accent); font-weight: 700; }
    .tabs .badge { margin-left: auto; align-self: center; font-family: var(--mono); font-size: 0.72rem; color: var(--accent-ink); }

    .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin: 1rem 0; }
    .controls input[type=search], .controls select, .add-input, .name-input {
      background: var(--card); color: var(--ink); border: 1px solid var(--hair); border-radius: 8px; padding: 0.5rem 0.7rem; font-size: 0.9rem; font-family: var(--sans);
    }
    .controls input[type=search] { min-width: 240px; flex: 1; }
    .chip-filter { display: flex; gap: 0.3rem; }
    .chip-filter button { font-family: var(--mono); font-size: 0.72rem; padding: 0.4rem 0.7rem; border-radius: 999px; border: 1px solid var(--hair); background: transparent; color: var(--ink-2); cursor: pointer; }
    .chip-filter button.on { background: var(--accent-2); color: #2a0016; border-color: var(--accent-2); font-weight: 700; }

    /* Photo cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .card { background: var(--card); border: 1px solid var(--hair); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .card.changed { border-color: var(--accent); box-shadow: var(--glow); }
    .card img { width: 100%; height: 190px; object-fit: cover; background: #0d0716; display: block; cursor: zoom-in; }
    .card .body { padding: 0.75rem 0.8rem 0.9rem; display: flex; flex-direction: column; gap: 0.55rem; }
    .card .meta { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase; display: flex; justify-content: space-between; gap: 0.5rem; }
    .card .cap { font-family: var(--serif); font-style: italic; color: var(--ink-2); font-size: 0.95rem; line-height: 1.35; }
    .card .cap.empty { opacity: 0.5; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chip { display: inline-flex; align-items: center; gap: 0.35rem; background: var(--paper-2); border: 1px solid var(--hair); border-radius: 999px; padding: 0.2rem 0.35rem 0.2rem 0.65rem; font-size: 0.82rem; }
    .chip.new { border-color: var(--accent-2); color: var(--accent-ink); }
    .chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 0.15rem; }
    .chip button:hover { color: var(--accent-2); }
    .picks { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
    .picks-lbl { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent-ink); margin-right: 0.2rem; }
    .pick { font-family: var(--sans); font-size: 0.82rem; padding: 0.28rem 0.6rem; border-radius: 7px; border: 1px solid var(--accent); background: rgba(244,183,64,0.1); color: var(--ink); cursor: pointer; }
    .pick:hover { background: var(--accent); color: #241300; }
    .pick.bare { border-color: var(--accent-2); background: rgba(255,79,163,0.12); font-style: italic; }
    .pick.bare:hover { background: var(--accent-2); color: #2a0016; }
    .pick.none { border-color: var(--hair); background: transparent; color: var(--muted); }
    .pick.none:hover { border-color: var(--accent-2); color: var(--accent-2); background: transparent; }
    .addrow { display: flex; gap: 0.4rem; }
    .add-input { flex: 1; }
    .note-input { width: 100%; background: transparent; border: none; border-top: 1px dashed var(--hair); color: var(--ink-2); font-style: italic; padding: 0.4rem 0 0; font-size: 0.85rem; font-family: var(--serif); }
    .note-input::placeholder { color: var(--muted); }
    .card .foot { display: flex; justify-content: space-between; align-items: center; }
    .reset { background: none; border: none; color: var(--muted); font-size: 0.72rem; font-family: var(--mono); cursor: pointer; text-decoration: underline; }
    .tag-ovr { font-family: var(--mono); font-size: 0.62rem; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 0.25rem; }

    /* People tab */
    .ppl { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 0.6rem; }
    .prow { background: var(--card); border: 1px solid var(--hair); border-radius: 10px; padding: 0.6rem 0.7rem; display: flex; flex-direction: column; gap: 0.45rem; }
    .prow.changed { border-color: var(--accent); }
    .prow.deleted { opacity: 0.45; }
    .prow .top { display: flex; gap: 0.5rem; align-items: center; }
    .name-input { flex: 1; }
    .prow .cnt { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); white-space: nowrap; text-decoration: none; }
    .prow a.cnt:hover { color: var(--accent-2); }
    .prow .acts { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .prow select { background: var(--paper-2); color: var(--ink); border: 1px solid var(--hair); border-radius: 6px; padding: 0.3rem 0.4rem; font-size: 0.8rem; }
    .linkbtn { background: none; border: none; color: var(--accent-2); font-family: var(--mono); font-size: 0.72rem; cursor: pointer; }
    .was { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); }

    /* Export */
    .exp { max-width: 820px; }
    .exp textarea { width: 100%; min-height: 320px; background: #0d0716; color: var(--ink-2); border: 1px solid var(--hair); border-radius: 10px; padding: 0.8rem; font-family: var(--mono); font-size: 0.78rem; line-height: 1.5; }
    .exp .row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin: 0.8rem 0; align-items: center; }
    .btn { font-family: var(--mono); font-size: 0.8rem; padding: 0.55rem 1rem; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #241300; font-weight: 700; cursor: pointer; }
    .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--hair); font-weight: 400; }
    .btn.danger { background: transparent; color: var(--accent-2); border-color: var(--accent-2); }
    .summary { font-family: var(--mono); font-size: 0.82rem; color: var(--ink-2); line-height: 1.7; }
    .summary b { color: var(--accent-ink); }
    .empty-state { color: var(--muted); font-style: italic; padding: 2rem 0; }
    .hint { color: var(--muted); font-size: 0.85rem; margin: 0.4rem 0 0; }
    a.homelink { color: var(--accent-2); font-family: var(--mono); font-size: 0.75rem; text-decoration: none; }
  </style>
</head>
<body>
  <div class="adm-wrap">
    <header class="adm-head">
      <h1>Corrections console</h1>
      <div class="sub">Stardust &amp; Beyond · local tool · <a class="homelink" href="index.html">back to site</a></div>
      <div class="tabs">
        <button data-tab="photos" class="on">Photos</button>
        <button data-tab="people">People &amp; names</button>
        <button data-tab="export">Export</button>
        <span class="badge" id="badge"></span>
      </div>
    </header>
    <main id="app"><p class="empty-state">Loading…</p></main>
  </div>
  <datalist id="roster-names"></datalist>
  <!-- dynamic import with a unique query so the browser never serves a stale module -->
  <script type="module">import("./js/corrections.js?v=" + Date.now());</script>
</body>
</html>
