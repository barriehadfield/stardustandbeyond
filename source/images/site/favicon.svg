<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Stardust & Beyond favicon: a gold disco star on the aubergine night ground,
       with a soft magenta/gold glow echoing the site. Design source; rendered to
       public/images/site/favicon.svg + icon-32/180.png by scripts/make-favicon.mjs. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#ff4fa3" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#7a1f57" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#140a1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd873"/>
      <stop offset="55%" stop-color="#f4b740"/>
      <stop offset="100%" stop-color="#e79a1f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#140a1e"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <!-- 5-point star, centred, sized to read at 16px -->
  <path fill="url(#gold)" d="M32 9 L39.2 24.4 L56 26.6 L43.6 38.2 L46.9 55 L32 46.6 L17.1 55 L20.4 38.2 L8 26.6 L24.8 24.4 Z"/>
</svg>
