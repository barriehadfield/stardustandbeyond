<!doctype html>
<!--
  Social share card (Open Graph / Twitter) design source, 1200x630.
  Renders to public/images/site/og-card.jpg via headless Chrome + sharp:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --screenshot=og.png --window-size=1200,630 --hide-scrollbars \
      "file://$PWD/source/og-card.html"
    node -e 'require("sharp")("og.png").jpeg({quality:86,mozjpeg:true}).toFile("public/images/site/og-card.jpg")'

  Palette, fonts and wordmark mirror css/style.css and the home hero, so the
  card matches the live site. The photo is the club LEAD (see site-data.mjs).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --paper: #140a1e; --ink: #f5edff; --ink-2: #c6b6dd; --muted: #8f80a8;
    --accent: #f4b740; --accent-2: #ff4fa3;
    --serif: "Iowan Old Style", ui-serif, "New York", Palatino, Georgia, serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--serif);
    -webkit-font-smoothing: antialiased; position: relative; overflow: hidden;
  }
  /* the dance-floor glow, as on the site */
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 55% at 8% 0%, rgba(255, 79, 163, 0.20), transparent 70%),
      radial-gradient(55% 60% at 70% 100%, rgba(244, 183, 64, 0.16), transparent 70%);
  }
  .fig {
    position: absolute; right: 70px; top: 55px; width: 346px; height: 520px;
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 18px 34px -6px rgba(0,0,0,.78), 0 54px 96px -22px rgba(0,0,0,.9), 0 0 60px rgba(244,183,64,.22);
    outline: 1px solid rgba(255, 210, 150, 0.22); outline-offset: -1px;
  }
  .fig img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .copy {
    position: absolute; left: 84px; top: 0; height: 630px; width: 660px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 17px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--accent-2); margin-bottom: 30px;
  }
  h1 { font-size: 104px; font-weight: 700; letter-spacing: -0.02em; line-height: 0.95; }
  h1 .amp { font-style: italic; color: var(--accent); }
  h1 .last { color: var(--accent-2); }
  .tag {
    font-style: italic; font-size: 30px; line-height: 1.35; color: var(--ink-2);
    max-width: 560px; margin-top: 30px;
  }
  .domain {
    position: absolute; left: 86px; bottom: 44px; font-family: var(--mono);
    font-size: 16px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <!-- The club photo that leads the site. Path is relative to source/og-card.html. -->
  <div class="fig"><img src="../source/images/the-stardust/image575.jpg" alt=""></div>
  <div class="copy">
    <p class="eyebrow">Durban · 1975</p>
    <h1>Stardust<span class="amp"> &amp;</span><br>Beyond<span class="last">.</span></h1>
    <p class="tag">A 1970s disco, and the friends who lived it.</p>
  </div>
  <div class="domain">stardustandbeyond.com</div>
</body>
</html>
