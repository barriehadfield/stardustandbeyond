<!doctype html>
<!--
  Social share card (Open Graph / Twitter) design source, 1200x630.
  Renders to public/images/site/og-card.jpg via headless Chrome:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --screenshot=og.png --window-size=1200,630 --hide-scrollbars \
      "file://$PWD/source/og-card.html"
    # then: sharp -> public/images/site/og-card.jpg  (see scripts note)

  System-font stacks match css/style.css, so this matches the live site.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --paper: #191a1d; --ink: #eeeeec; --ink-2: #b7b8bd; --muted: #84858c; --accent: #ff6f49;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; position: relative; overflow: hidden;
  }
  .art {
    position: absolute; inset: 0 0 0 auto; width: 540px; height: 630px;
    object-fit: cover; object-position: center 16%;
  }
  /* fade the painting into the charcoal text panel */
  .fade {
    position: absolute; inset: 0 0 0 auto; width: 680px; height: 630px;
    background: linear-gradient(90deg, var(--paper) 0%, var(--paper) 20%, rgba(25,26,29,0) 60%);
  }
  .copy {
    position: absolute; left: 78px; top: 0; height: 630px; width: 620px;
    display: flex; flex-direction: column; justify-content: center; gap: 28px;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 15px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--muted);
  }
  h1 { font-size: 98px; font-weight: 640; letter-spacing: -0.03em; line-height: 0.92; }
  h1 b { color: var(--accent); font-weight: 640; }
  .tag {
    font-family: var(--serif); font-style: italic; font-size: 27px; line-height: 1.42;
    color: var(--ink-2); max-width: 500px;
  }
  .domain {
    position: absolute; left: 80px; bottom: 46px; font-family: var(--mono);
    font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
</style>
</head>
<body>
  <!-- The club photo that leads the site. Path is relative to source/og-card.html. -->
  <img class="art" src="../public/images/the-stardust/image472.jpg" alt="">
  <div class="fade"></div>
  <div class="copy">
    <p class="eyebrow">The Stardust · Durban 1975</p>
    <h1>Stardust<b> &amp; </b>Beyond</h1>
    <p class="tag">A photographic archive of The Stardust disco and the friends who lived it.</p>
  </div>
  <div class="domain">stardustandbeyond.com</div>
</body>
</html>
